openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Home dashboard aggregate data
  - name: planner-items
    description: Unified planner items (homework, exams, events, study blocks, notes)
  - name: study-sessions
    description: Logged focus/study sessions
  - name: quotes
    description: Daily motivational quotes
  - name: subjects
    description: Subject binders (notes, files, mastery, progress)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: focus-sessions
    description: Bloom Focus Tracker sessions, history, and statistics
  - name: progress
    description: Grade Progress Tracker data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Aggregate stats for the home dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /planner-items:
    get:
      operationId: listPlannerItems
      tags: [planner-items]
      summary: List planner items in a date range, optionally filtered by type
      parameters:
        - name: from
          in: query
          required: false
          description: "Inclusive start date (YYYY-MM-DD)"
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: "Inclusive end date (YYYY-MM-DD). Defaults to `from` when omitted."
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PlannerItemType"
      responses:
        "200":
          description: List of planner items, ordered by date then start time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerItem"
    post:
      operationId: createPlannerItem
      tags: [planner-items]
      summary: Create a planner item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerItemInput"
      responses:
        "201":
          description: Created planner item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"

  /planner-items/{id}:
    patch:
      operationId: updatePlannerItem
      tags: [planner-items]
      summary: Update a planner item (edit fields or toggle completion)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerItemUpdate"
      responses:
        "200":
          description: Updated planner item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"
    delete:
      operationId: deletePlannerItem
      tags: [planner-items]
      summary: Delete a planner item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /study-sessions:
    post:
      operationId: createStudySession
      tags: [study-sessions]
      summary: Log a completed study/focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Created study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"

  /quotes/daily:
    get:
      operationId: getDailyQuote
      tags: [quotes]
      summary: Get today's rotating quote
      responses:
        "200":
          description: Daily quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List all subjects with card summary fields
      responses:
        "200":
          description: List of subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"

  /subjects/{id}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get a single subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update a subject (name, emoji, mastery)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    delete:
      operationId: deleteSubject
      tags: [subjects]
      summary: Delete a subject and its notes/files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subjects/{id}/summary:
    get:
      operationId: getSubjectSummary
      tags: [subjects]
      summary: Progress + recent activity for a subject workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSummary"

  /subjects/{id}/notes:
    get:
      operationId: listSubjectNotes
      tags: [subjects]
      summary: List notes for a subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectNote"
    post:
      operationId: createSubjectNote
      tags: [subjects]
      summary: Create a note for a subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectNote"

  /subjects/{id}/notes/{noteId}:
    patch:
      operationId: updateSubjectNote
      tags: [subjects]
      summary: Update a subject note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectNoteInput"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectNote"
    delete:
      operationId: deleteSubjectNote
      tags: [subjects]
      summary: Delete a subject note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subjects/{id}/files:
    get:
      operationId: listSubjectFiles
      tags: [subjects]
      summary: List files for a subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectFile"
    post:
      operationId: createSubjectFile
      tags: [subjects]
      summary: Record metadata for an uploaded file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectFileInput"
      responses:
        "201":
          description: Created file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectFile"

  /subjects/{id}/files/{fileId}:
    delete:
      operationId: deleteSubjectFile
      tags: [subjects]
      summary: Delete a subject file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: "Object path within the private object dir (e.g. uploads/some-uuid)."
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /focus-sessions:
    get:
      operationId: listFocusSessions
      tags: [focus-sessions]
      summary: List completed focus sessions
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter by session name (partial match)
        - name: subject
          in: query
          schema:
            type: string
          description: Filter by subject name (exact)
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort by date ascending or descending (default desc)
      responses:
        "200":
          description: Array of completed focus sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusSession"
    post:
      operationId: startFocusSession
      tags: [focus-sessions]
      summary: Start a new focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"

  /focus-sessions/stats:
    get:
      operationId: getFocusStats
      tags: [focus-sessions]
      summary: Aggregate statistics for the Focus Tracker
      responses:
        "200":
          description: Focus statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusStats"

  /focus-sessions/{id}/end:
    post:
      operationId: endFocusSession
      tags: [focus-sessions]
      summary: End a focus session and save reflection data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionEndInput"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "404":
          description: Session not found

  /focus-sessions/{id}:
    delete:
      operationId: deleteFocusSession
      tags: [focus-sessions]
      summary: Delete a focus session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /progress/grades:
    get:
      operationId: listProgressGrades
      tags: [progress]
      summary: List all grade rows
      responses:
        "200":
          description: Grade database rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressGrade"
    post:
      operationId: createProgressGrade
      tags: [progress]
      summary: Add a subject grade row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressGradeInput"
      responses:
        "201":
          description: Created grade row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressGrade"

  /progress/grades/{id}:
    patch:
      operationId: updateProgressGrade
      tags: [progress]
      summary: Update a grade row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressGradeUpdate"
      responses:
        "200":
          description: Updated grade row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressGrade"
    delete:
      operationId: deleteProgressGrade
      tags: [progress]
      summary: Delete a grade row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      required:
        - greetingName
        - studyMinutesToday
        - tasksDueToday
        - upcomingExamsCount
        - focusStreakDays
        - bloomProgressPercent
        - bloomProgressLabel
      properties:
        greetingName:
          type: string
        studyMinutesToday:
          type: integer
        tasksDueToday:
          type: integer
        upcomingExamsCount:
          type: integer
        focusStreakDays:
          type: integer
        bloomProgressPercent:
          type: integer
        bloomProgressLabel:
          type: string

    PlannerItemType:
      type: string
      enum: [homework, exam, event, study_block, note]

    PlannerItemPriority:
      type: string
      enum: [low, medium, high]

    PlannerItem:
      type: object
      required:
        - id
        - title
        - type
        - date
        - priority
        - completed
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          $ref: "#/components/schemas/PlannerItemType"
        subject:
          type: ["string", "null"]
        date:
          type: string
          description: "Calendar date YYYY-MM-DD this item belongs to"
        startTime:
          type: ["string", "null"]
          description: "24h time HH:mm"
        endTime:
          type: ["string", "null"]
          description: "24h time HH:mm"
        reminderMinutes:
          type: ["integer", "null"]
          enum: [5, 15, 30, 60, 120, 1440]
          description: "Minutes before the scheduled start/due time to notify"
        priority:
          $ref: "#/components/schemas/PlannerItemPriority"
        completed:
          type: boolean
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PlannerItemInput:
      type: object
      required:
        - title
        - type
        - date
      properties:
        title:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/PlannerItemType"
        subject:
          type: string
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        reminderMinutes:
          type: integer
          enum: [5, 15, 30, 60, 120, 1440]
        priority:
          $ref: "#/components/schemas/PlannerItemPriority"
        notes:
          type: string

    PlannerItemUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        subject:
          type: string
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        reminderMinutes:
          type: integer
          enum: [5, 15, 30, 60, 120, 1440]
        priority:
          $ref: "#/components/schemas/PlannerItemPriority"
        completed:
          type: boolean
        notes:
          type: string

    StudySession:
      type: object
      required:
        - id
        - subject
        - durationMinutes
        - date
        - createdAt
      properties:
        id:
          type: integer
        subject:
          type: ["string", "null"]
        durationMinutes:
          type: integer
        date:
          type: string
          description: "Calendar date YYYY-MM-DD"
        createdAt:
          type: string
          format: date-time

    StudySessionInput:
      type: object
      required:
        - durationMinutes
      properties:
        subject:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
        date:
          type: string
          description: "Calendar date YYYY-MM-DD, defaults to today"

    Quote:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        author:
          type: ["string", "null"]

    Subject:
      type: object
      required:
        - id
        - name
        - emoji
        - masteryPercent
        - masteryLabel
        - notesCount
        - filesCount
        - upcomingItem
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        emoji:
          type: string
        masteryPercent:
          type: integer
        masteryLabel:
          type: string
        notesCount:
          type: integer
        filesCount:
          type: integer
        upcomingItem:
          oneOf:
            - $ref: "#/components/schemas/PlannerItem"
            - type: "null"
        createdAt:
          type: string
          format: date-time

    SubjectInput:
      type: object
      required:
        - name
        - emoji
      properties:
        name:
          type: string
          minLength: 1
        emoji:
          type: string
          minLength: 1

    SubjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        emoji:
          type: string
          minLength: 1
        masteryPercent:
          type: integer
          minimum: 0
          maximum: 100

    SubjectActivityItem:
      type: object
      required:
        - kind
        - title
        - emoji
        - timestamp
      properties:
        kind:
          type: string
          enum: [note, file, study_session, planner_item]
        title:
          type: string
        emoji:
          type: string
        timestamp:
          type: string
          format: date-time

    SubjectSummary:
      type: object
      required:
        - studyMinutesTotal
        - tasksCompleted
        - tasksTotal
        - recentActivity
      properties:
        studyMinutesTotal:
          type: integer
        tasksCompleted:
          type: integer
        tasksTotal:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/SubjectActivityItem"

    SubjectNote:
      type: object
      required:
        - id
        - subjectId
        - title
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubjectNoteInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string

    SubjectFile:
      type: object
      required:
        - id
        - subjectId
        - fileName
        - objectPath
        - contentType
        - sizeBytes
        - createdAt
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        fileName:
          type: string
        objectPath:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time

    SubjectFileInput:
      type: object
      required:
        - fileName
        - objectPath
        - contentType
        - sizeBytes
      properties:
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 0

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. image/jpeg).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    FocusSession:
      type: object
      required:
        - id
        - name
        - sessionType
        - startedAt
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        subject:
          type: string
          nullable: true
        sessionType:
          type: string
          enum: [homework, study, revision, practice, other]
        notes:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        focusQuality:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
        wentWell:
          type: string
          nullable: true
        distracted:
          type: string
          nullable: true
        reflectionNotes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    FocusSessionInput:
      type: object
      required: [name, sessionType]
      properties:
        name:
          type: string
          minLength: 1
        subject:
          type: string
        sessionType:
          type: string
          enum: [homework, study, revision, practice, other]
        notes:
          type: string

    FocusSessionEndInput:
      type: object
      required: [durationMinutes]
      properties:
        durationMinutes:
          type: integer
          minimum: 0
        focusQuality:
          type: integer
          minimum: 1
          maximum: 10
        wentWell:
          type: string
        distracted:
          type: string
        reflectionNotes:
          type: string

    FocusStats:
      type: object
      required:
        - totalMinutes
        - totalSessions
        - avgLength
        - longestSession
        - byDay
