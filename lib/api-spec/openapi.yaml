openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Home dashboard aggregate data
  - name: planner-items
    description: Unified planner items (homework, exams, events, study blocks, notes)
  - name: study-sessions
    description: Logged focus/study sessions
  - name: quotes
    description: Daily motivational quotes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Aggregate stats for the home dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /planner-items:
    get:
      operationId: listPlannerItems
      tags: [planner-items]
      summary: List planner items in a date range, optionally filtered by type
      parameters:
        - name: from
          in: query
          required: false
          description: "Inclusive start date (YYYY-MM-DD)"
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: "Inclusive end date (YYYY-MM-DD). Defaults to `from` when omitted."
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PlannerItemType"
      responses:
        "200":
          description: List of planner items, ordered by date then start time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerItem"
    post:
      operationId: createPlannerItem
      tags: [planner-items]
      summary: Create a planner item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerItemInput"
      responses:
        "201":
          description: Created planner item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"

  /planner-items/{id}:
    patch:
      operationId: updatePlannerItem
      tags: [planner-items]
      summary: Update a planner item (edit fields or toggle completion)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerItemUpdate"
      responses:
        "200":
          description: Updated planner item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"
    delete:
      operationId: deletePlannerItem
      tags: [planner-items]
      summary: Delete a planner item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /study-sessions:
    post:
      operationId: createStudySession
      tags: [study-sessions]
      summary: Log a completed study/focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Created study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"

  /quotes/daily:
    get:
      operationId: getDailyQuote
      tags: [quotes]
      summary: Get today's rotating quote
      responses:
        "200":
          description: Daily quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      required:
        - greetingName
        - studyMinutesToday
        - tasksDueToday
        - upcomingExamsCount
        - focusStreakDays
        - bloomProgressPercent
        - bloomProgressLabel
      properties:
        greetingName:
          type: string
        studyMinutesToday:
          type: integer
        tasksDueToday:
          type: integer
        upcomingExamsCount:
          type: integer
        focusStreakDays:
          type: integer
        bloomProgressPercent:
          type: integer
        bloomProgressLabel:
          type: string

    PlannerItemType:
      type: string
      enum: [homework, exam, event, study_block, note]

    PlannerItemPriority:
      type: string
      enum: [low, medium, high]

    PlannerItem:
      type: object
      required:
        - id
        - title
        - type
        - date
        - priority
        - completed
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          $ref: "#/components/schemas/PlannerItemType"
        subject:
          type: ["string", "null"]
        date:
          type: string
          description: "Calendar date YYYY-MM-DD this item belongs to"
        startTime:
          type: ["string", "null"]
          description: "24h time HH:mm"
        endTime:
          type: ["string", "null"]
          description: "24h time HH:mm"
        priority:
          $ref: "#/components/schemas/PlannerItemPriority"
        completed:
          type: boolean
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PlannerItemInput:
      type: object
      required:
        - title
        - type
        - date
      properties:
        title:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/PlannerItemType"
        subject:
          type: string
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        priority:
          $ref: "#/components/schemas/PlannerItemPriority"
        notes:
          type: string

    PlannerItemUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        subject:
          type: string
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        priority:
          $ref: "#/components/schemas/PlannerItemPriority"
        completed:
          type: boolean
        notes:
          type: string

    StudySession:
      type: object
      required:
        - id
        - subject
        - durationMinutes
        - date
        - createdAt
      properties:
        id:
          type: integer
        subject:
          type: ["string", "null"]
        durationMinutes:
          type: integer
        date:
          type: string
          description: "Calendar date YYYY-MM-DD"
        createdAt:
          type: string
          format: date-time

    StudySessionInput:
      type: object
      required:
        - durationMinutes
      properties:
        subject:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
        date:
          type: string
          description: "Calendar date YYYY-MM-DD, defaults to today"

    Quote:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        author:
          type: ["string", "null"]
