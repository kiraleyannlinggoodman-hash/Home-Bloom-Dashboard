kind = "web"
previewPath = "/"
title = "Bloom"
version = "1.0.0"
id = "artifacts/bloom"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20276

[services.development]
run = "pnpm --filter @workspace/bloom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bloom", "run", "build" ]
serve = "static"
publicDir = "artifacts/bloom/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20276"
BASE_PATH = "/"
